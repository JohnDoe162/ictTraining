[project]
name = "ict-dol-model"
version = "1.0.0"
description = "Concept models that score ICT price arrays on MGC: draws on liquidity (1h) and sweep reversals (5m)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=17"]

[dependency-groups]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
